# Use root/example as user/password credentials
version: '3.7'

services:

  db:
    image: mysql:5.7
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: axway123
      MYSQL_USER: axway
      MYSQL_PASSWORD: axway123
    ports:
      - 3306:3306

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080