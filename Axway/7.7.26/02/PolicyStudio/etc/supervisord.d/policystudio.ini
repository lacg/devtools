; Policy Studio — supervised as a foreground process.
;
; autorestart=true means supervisord always restarts Policy Studio,
; even if the user closes the window (exit code 0).
;
; startsecs=15 gives Policy Studio enough time to initialize the JVM and SWT UI
; before supervisord decides it has "started successfully".
[program:policystudio]
priority = 30
command = /bin/bash -c "until DISPLAY=:1 xset q &>/dev/null; do sleep 0.5; done && exec /opt/axway/policystudio/policystudio --maximized"
environment = DISPLAY=":1",HOME="/home/USERNAME",USER="USERNAME",LD_LIBRARY_PATH="/opt/axway/policystudio"
user = USERNAME
autorestart = true
startsecs = 15
startretries = 3
stopwaitsecs = 60
stdout_logfile = /var/log/supervisor/policystudio.log
redirect_stderr = true
