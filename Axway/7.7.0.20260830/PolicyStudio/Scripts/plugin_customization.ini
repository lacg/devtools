# Eclipse preference defaults for Policy Studio, loaded via -pluginCustomization in
# policystudio.ini. These are DEFAULT-scope values: anything a user changes in
# Window -> Preferences (instance scope) still takes precedence.
#
# Allow environmentalization of fields (Preferences -> Environment Settings). Off in the
# vendor build, so every open of an environmentalized project (all Centene policy repos)
# pops "This configuration contains environmentalized fields ... will be turned on
# automatically". Default it on.
com.vordel.rcp.policystudio/show.env.field.decorators=true
