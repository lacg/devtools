; KasmVNC — container-native VNC server with built-in browser UI on port 6901.
; Replaces TigerVNC + websockify + noVNC from the base/8 stack.
; Runs as the axway user on display :1.
; SecurityTypes=None + DisableBasicAuth: no auth required. This is intentional —
; the port is only exposed on localhost so there is no remote attack surface.
; BasicAuth caused browser prefetch requests to trigger IP blacklisting before
; the user could log in, breaking the WebSocket VNC connection.
[program:kasmvnc]
priority = 10
command = /usr/bin/Xvnc :1
    -geometry 1920x1080
    -depth 24
    -SecurityTypes None
    -DisableBasicAuth
    -websocketPort 6901
    -interface 0.0.0.0
    -httpd /usr/share/kasmvnc/www
    -webpEncodingTime 0
user = USERNAME
autorestart = true
startsecs = 3
stopwaitsecs = 10
stdout_logfile = /var/log/supervisor/kasmvnc.log
redirect_stderr = true
