; Openbox window manager on the KasmVNC display.
; Waits for the X display to be ready before starting.
; The autostart file at ~/.config/openbox/autostart disables DPMS/screensaver.
[program:openbox]
priority = 20
command = /bin/bash -c "until DISPLAY=:1 xset q &>/dev/null; do sleep 0.5; done && exec dbus-launch --exit-with-session /usr/bin/openbox-session"
environment = DISPLAY=":1",HOME="/home/USERNAME",USER="USERNAME"
user = USERNAME
autorestart = true
startsecs = 3
stopwaitsecs = 5
stdout_logfile = /var/log/supervisor/openbox.log
redirect_stderr = true
